<!DOCTYPE html>
<!-- GC_MASTER_STABLE_2026_08R9_SPEED_LOCKED_SAFE -->
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f8fb">
  <title>GC 台中白牌車隊 24H</title>
  <style id="gc-critical-loading">
    /* GC_R9_CRITICAL_LOADING：只負責第一眼立即有畫面；完整樣式仍由 gc-app.css 接手。 */
    :root{--gc-load-page:#f5f8fb;--gc-load-line:#d9e4ee;--gc-load-navy:#102d51}
    *{box-sizing:border-box}html,body{min-height:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#eef6fd 0,var(--gc-load-page) 210px,var(--gc-load-page) 100%);-webkit-font-smoothing:antialiased}
    #app{width:100%;max-width:620px;min-height:100vh;margin:0 auto;padding:18px 14px calc(28px + env(safe-area-inset-bottom))}
    .loading-card{margin-top:14vh;padding:28px 24px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;border:1px solid rgba(217,228,238,.92);border-radius:22px;box-shadow:0 12px 34px rgba(16,45,81,.12)}
    .loading-card .brand-avatar{display:block;width:58px;height:58px;flex:0 0 58px;object-fit:cover;border-radius:18px;background:var(--gc-load-navy);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 7px 18px rgba(16,45,81,.2)}
    .loading-card p{margin:15px 0 0;color:#60778b;font-size:13px;font-weight:600;letter-spacing:.01em}
    .gc-loading-dots{display:flex;gap:6px;margin-top:13px;height:7px;align-items:center}.gc-loading-dots span{display:block;width:6px;height:6px;border-radius:50%;background:#6f96b7;opacity:.34;animation:gcCriticalDot 1.05s ease-in-out infinite}.gc-loading-dots span:nth-child(2){animation-delay:.14s}.gc-loading-dots span:nth-child(3){animation-delay:.28s}@keyframes gcCriticalDot{0%,70%,100%{opacity:.28;transform:translateY(0)}35%{opacity:.9;transform:translateY(-2px)}}
    @media(prefers-reduced-motion:reduce){.gc-loading-dots span{animation:none}}
  </style>
  <link rel="preconnect" href="https://static.line-scdn.net" crossorigin>
  <link rel="dns-prefetch" href="//static.line-scdn.net">
  <link rel="stylesheet" href="gc-app.css?v=1786205419">
  <link rel="preload" href="表格頭像_直接更換.png?v=1786205419" as="image" type="image/png" fetchpriority="high">
  <script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script defer src="gc-app.js?v=1786205419"></script>
</head>
<body>
  <main id="app" aria-live="polite">
    <section class="loading-card" aria-label="服務載入中">
      <img class="brand-avatar" src="表格頭像_直接更換.png?v=1786205419" width="58" height="58" decoding="async" fetchpriority="high" alt="GC 車隊頭像">
      <p id="loadingText">正在開啟服務…</p>
      <div class="gc-loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </section>
  </main>
</body>
</html>
